name: Build watch app

on:
  push:
    branches: [claude/calc3-watch-tutor-txzyvd, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Validate content
        run: python3 tools/build_tree.py && git diff --exit-code Calc3Tutor/tutor.json

      - name: Build for watchOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Calc3Tutor.xcodeproj -target Calc3Tutor -configuration Debug \
            -sdk watchsimulator \
            CODE_SIGNING_ALLOWED=NO | tee sim.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" sim.log

      - name: Build for watchOS device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Calc3Tutor.xcodeproj -target Calc3Tutor -configuration Release \
            -sdk watchos \
            CODE_SIGNING_ALLOWED=NO | tee device.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" device.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"

  template-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: menu-app-template
    steps:
      - uses: actions/checkout@v4
      - name: Install optional schema checker
        run: pip install jsonschema
      - name: Rebuild example content (must be committed)
        run: python3 content/example_tree.py && git diff --exit-code .
      - name: Tests
        run: python3 tests/run_tests.py

  template-swiftui:
    runs-on: macos-15
    defaults:
      run:
        working-directory: menu-app-template/renderers/swiftui
    steps:
      - uses: actions/checkout@v4
      - name: Build template app for watchOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project MenuApp.xcodeproj -target MenuApp -configuration Debug \
            -sdk watchsimulator \
            CODE_SIGNING_ALLOWED=NO | tee template.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" template.log

  watch-screenshots:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build, install on a watch simulator, screenshot screens
        run: |
          set -euo pipefail
          xcodebuild build -project Calc3Tutor.xcodeproj -target Calc3Tutor -configuration Debug \
            -sdk watchsimulator CODE_SIGNING_ALLOWED=NO -quiet
          APP=build/Debug-watchsimulator/Calc3Tutor.app
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          c = sorted((k, x["name"], x["udid"]) for k, v in d.items() if "watchOS" in k for x in v)
          big = [t for t in c if "46mm" in t[1] or "45mm" in t[1]] or c
          print(big[-1][2])')
          echo "Device: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          for n in root t_polar t_sph_bounds t_green tr_trig exam_map; do
            xcrun simctl terminate "$UDID" com.calc3tutor.watchkitapp 2>/dev/null || true
            xcrun simctl launch "$UDID" com.calc3tutor.watchkitapp -startNode "$n"
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$n.png"
          done
      - name: Print a contact sheet into the log (base64 PNG, for reviewers without artifact access)
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import base64, io, glob
          from PIL import Image
          names = ["root", "t_polar", "t_green", "tr_trig"]
          imgs = [Image.open(f"shots/{n}.png").convert("RGB") for n in names]
          w, h = imgs[0].size
          sheet = Image.new("RGB", (w * 2, h * 2), "white")
          for i, im in enumerate(imgs):
              sheet.paste(im, ((i % 2) * w, (i // 2) * h))
          sheet = sheet.quantize(colors=48)
          buf = io.BytesIO()
          sheet.save(buf, "PNG", optimize=True)
          print("SHEET_SIZE", sheet.size, len(buf.getvalue()))
          print("SHEET_B64 " + base64.b64encode(buf.getvalue()).decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-screenshots
          path: shots/
